apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all the files
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      command: ["/bin/sh"]
      args:
        - "-c"
        - "rm -rf $(workspaces.source.path)/*"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: This task runs flake8 to lint Python code
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 service --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task runs unit tests using the nose testing framework
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nose
      type: string
      default: "-v"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          nosetests $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  description: This task deploys the application to OpenShift
  workspaces:
    - name: source
  params:
    - name: image-name
      type: string
      description: The name of the image to deploy
    - name: app-name
      type: string
      description: The name of the application deployment
      default: "cd-app"
  steps:
    - name: deploy-openshift
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.source.path)
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          oc create deployment $(params.app-name) --image=$(params.image-name) --dry-run=client -o yaml | oc apply -f -
          oc expose deployment $(params.app-name) --port=8000 --dry-run=client -o yaml | oc apply -f -
          oc rollout status deployment/$(params.app-name)
